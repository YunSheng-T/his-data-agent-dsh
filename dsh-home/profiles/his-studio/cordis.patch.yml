# his-studio patch 层（P0-9 三栏工作台）
# 与 his-data-agent 的差异：
#   - bundles 只含 dsh-base（不挂 dsh-headless，进程常驻而不是跑完任务即退出）
#   - 不挂 headless answerer（studio-ui 自带 UI 应答器，审批挂起等人点按钮）
#   - 新增 his-studio-ui 插件（node:http 三栏工作台，端口 HIS_STUDIO_PORT 默认 7300）
# 安全边界与 his-data-agent 完全一致：关 shell/文件写/遥测，写操作只走域工具

# 内网模型路由（OpenAI 兼容网关）：把 baseURL 换成内网网关地址，设 INTERNAL_LLM_API_KEY 即可，
# 让 Studio 用内部模型，无需 DEEPSEEK_API_KEY。若想用外网 DeepSeek，删掉下面两段即可。
# ⚠ 只改 baseURL 那一行的值！models/api/apiKeyEnv/displayName 必须整段保留：
#   cordis patch 是按 id 整块替换 config（不合并），删掉 models 会让这个用户自定义
#   provider「internal-openai」解析不出模型 → 启动即报 plugin tree failed / resolves no models。
#
# 「各用各的 provider」：internal-openai 只是内置默认之一；用户可在 dsh-home/settings.yaml 写
# llm-pi-ai 段加自己的 OpenAI 兼容网关（dsh 原生 providers dict 动态增删，重启热加载）：
#   llm-pi-ai:
#     providers:
#       my-gateway:
#         displayName: 我的网关
#         api: openai-completions
#         baseURL: https://gateway.example.com/v1
#         apiKeyEnv: MY_GATEWAY_API_KEY
#         models:
#           - id: my-model
#             contextWindow: 131072
#   然后设 MY_GATEWAY_API_KEY，会话区 provider 下拉即可看到 my-gateway 并切换。
- id: llm-pi-ai
  config:
    providers:
      internal-openai:
        displayName: 内网模型网关（OpenAI 兼容）
        api: openai-completions
        baseURL: http://127.0.0.1:8300/v1   # ← 换成你们内网网关地址（仅此一行）
        apiKeyEnv: INTERNAL_LLM_API_KEY
        models:
          - id: internal-chat              # ← 换成网关上的真实模型 id
            contextWindow: 131072
# 双模型路由（内网为默认，DeepSeek 可切换）：默认 agent-default-model 指向 internal-openai。
# 启动时 launcher 按所设 key 自动写 settings.yaml 定默认：设 INTERNAL_LLM_API_KEY → internal；
# 只设 DEEPSEEK_API_KEY → 切到 deepseek-official；都不设 → 报错。用户也可用会话区下拉手动切。
# ⚠ 不要在此写死 provider 为 deepseek——内网为主场景会误落外网导致报错。
- id: agent-default-model
  config:
    provider: internal-openai
    model: internal-chat
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: tool-web
  disabled: true
- id: session-telemetry-otel
  disabled: true

# P0 边界：不做子 Agent / 后台任务，全部摘除（V9 设计定稿）
- id: subagent
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: tool-jobs
  disabled: true
# 级联依赖：subagents 服务摘除后这三个注入它，必须一并禁用
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true

- insert:
    - id: his-approval-policy
      name: '@his/approval-policy'
      config:
        riskOverrides:
          todo_write: read
          exit_plan_mode: read
          create_goal: read
          get_goal: read
          update_goal: read
          run_code: read
    - id: his-domain-tools-modeling
      name: '@his/domain-tools-modeling'
    - id: his-workspace-anchor
      name: '@his/workspace-anchor'
    - id: his-workspace-repo
      name: '@his/workspace-repo'
    - id: his-domain-tools-ontology
      name: '@his/domain-tools-ontology'
    - id: his-domain-tools-dev
      name: '@his/domain-tools-dev'
    - id: his-domain-tools-ops
      name: '@his/domain-tools-ops'
    - id: his-studio-ui
      name: '@his/studio-ui'

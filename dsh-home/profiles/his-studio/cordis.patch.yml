# his-studio patch 层（P0-9 三栏工作台）
# 与 his-data-agent 的差异：
#   - bundles 只含 dsh-base（不挂 dsh-headless，进程常驻而不是跑完任务即退出）
#   - 不挂 headless answerer（studio-ui 自带 UI 应答器，审批挂起等人点按钮）
#   - 新增 his-studio-ui 插件（node:http 三栏工作台，端口 HIS_STUDIO_PORT 默认 7300）
# 安全边界与 his-data-agent 完全一致：关 shell/文件写/遥测，写操作只走域工具

# 内网模型路由（OpenAI 兼容网关）：把 baseURL 换成内网网关地址，设 INTERNAL_LLM_API_KEY 即可，
# 让 Studio 用内部模型，无需 DEEPSEEK_API_KEY。若想用外网 DeepSeek，删掉下面两段即可。
- id: llm-pi-ai
  config:
    providers:
      internal-openai:
        displayName: 内网模型网关（OpenAI 兼容）
        api: openai-completions
        baseURL: http://127.0.0.1:8300/v1   # ← 换成你们内网网关地址（仅此一行）
        apiKeyEnv: INTERNAL_LLM_API_KEY
        models:
          - id: internal-chat              # ← 换成网关上的真实模型 id
            contextWindow: 131072
- id: agent-default-model
  config:
    provider: internal-openai
    model: internal-chat
# 显式摘除外网 DeepSeek 路由（dsh-base 默认启用 llm-deepseek）：内部模型下只保留
# internal-openai 一条路，避免 agent-default-model 一旦失效就回退 deepseek-official
# 而强要 DEEPSEEK_API_KEY（即「设了内部模型仍报没有 DeepSeek_API_KEY」）
- id: llm-deepseek
  disabled: true
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: true
- id: tool-fs
  disabled: true
- id: tool-fs-search
  disabled: true
- id: tool-str-replace-editor
  disabled: true
- id: tool-web
  disabled: true
- id: session-telemetry-otel
  disabled: true

# P0 边界：不做子 Agent / 后台任务，全部摘除（V9 设计定稿）
- id: subagent
  disabled: true
- id: subagent-spawn-in-process
  disabled: true
- id: subagent-fork-in-process
  disabled: true
- id: tool-subagent-control
  disabled: true
- id: tool-subagent-list-agents
  disabled: true
- id: tool-subagent
  disabled: true
- id: tool-subagent-fork
  disabled: true
- id: tool-subagent-report
  disabled: true
- id: tool-jobs
  disabled: true
# 级联依赖：subagents 服务摘除后这三个注入它，必须一并禁用
- id: workflow-worker-thread
  disabled: true
- id: tool-workflow
  disabled: true
- id: tool-ralph
  disabled: true

- insert:
    - id: his-approval-policy
      name: '@his/approval-policy'
      config:
        riskOverrides:
          todo_write: read
          exit_plan_mode: read
          create_goal: read
          get_goal: read
          update_goal: read
          run_code: read
    - id: his-domain-tools-modeling
      name: '@his/domain-tools-modeling'
    - id: his-workspace-anchor
      name: '@his/workspace-anchor'
    - id: his-workspace-repo
      name: '@his/workspace-repo'
    - id: his-domain-tools-ontology
      name: '@his/domain-tools-ontology'
    - id: his-domain-tools-dev
      name: '@his/domain-tools-dev'
    - id: his-domain-tools-ops
      name: '@his/domain-tools-ops'
    - id: his-studio-ui
      name: '@his/studio-ui'

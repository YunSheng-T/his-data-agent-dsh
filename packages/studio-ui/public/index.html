<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HIS Data Agent · 数据工作台</title>
<style>
:root{
  --paper:#f4f4f3; --paper-deep:#e9e9e7;
  --ink:#0b0b0b; --muted:#6d6a64; --faint:#a9a9a4;
  --hair:rgba(11,11,11,.12); --hair-soft:rgba(11,11,11,.07);
  --term-bg:#0b0b0b; --term-green:#0f0; --term-dim:#4d7a4d;
  --ok:#1f8a4c; --warn:#9a6a14; --err:#b02a44;
  --sans:Inter,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--sans);font-size:13px;line-height:1.6;color:var(--ink);background:var(--paper);overflow:hidden}
button{font-family:inherit;cursor:pointer;background:none;border:none;color:inherit}
input,textarea,select{font-family:inherit}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(11,11,11,.16);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}
.mono{font-family:var(--mono)}

.tlabel{display:inline-block;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);padding:2px 8px;border:1px solid var(--hair);border-radius:99px;white-space:nowrap}
.tlabel.green{color:#0a7a34;border-color:rgba(10,122,52,.35)}
.tlabel.warn{color:var(--warn);border-color:rgba(154,106,20,.4)}

/* 顶栏 */
.topbar{height:44px;display:flex;align-items:center;padding:0 18px;gap:14px;border-bottom:1px solid var(--hair)}
.wordmark{font-weight:700;font-size:14px}
.wordmark em{font-style:normal;font-family:var(--mono);font-weight:400;font-size:10px;letter-spacing:.14em;color:var(--muted);margin-left:8px}
.topbar .vr{width:1px;height:16px;background:var(--hair)}
.topbar .crumb{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.topbar .right{margin-left:auto;display:flex;gap:10px;align-items:center}

.ide{display:flex;height:calc(100vh - 44px)}

/* 左栏 */
.left{width:244px;flex:none;border-right:1px solid var(--hair);display:flex;flex-direction:column;min-height:0}
.menu{padding:12px 12px 8px;border-bottom:1px solid var(--hair-soft)}
.menu button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;padding:7px 10px;border-radius:7px;font-size:12.5px;color:var(--muted)}
.menu button.on{background:var(--ink);color:var(--paper)}
.menu button:not(.on):hover{background:var(--paper-deep);color:var(--ink)}
.menu button.dim{opacity:.45;pointer-events:none}
.menu button .m-ico{font-family:var(--mono);font-size:10px;width:16px;text-align:center}
.dir-head{display:flex;align-items:center;padding:12px 14px 8px}
.dir-head .tlabel{flex:none}
.dir-head select{margin-left:auto;font-size:10px;border:1px solid var(--hair);background:#fff;color:var(--ink);max-width:130px;border-radius:6px;padding:2px 4px}
.model-tree{flex:1;overflow-y:auto;padding:0 10px 12px;min-height:0}
.tree-domain{margin:6px 0 2px}
.tree-domain .td-head{display:flex;align-items:center;gap:7px;padding:5px 8px;font-size:11px;color:var(--muted);user-select:none}
.tree-domain .td-head .cnt{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--faint)}
.tnode{display:flex;align-items:center;gap:7px;width:100%;text-align:left;padding:5px 8px 5px 16px;border-radius:6px;font-family:var(--mono);font-size:11px;color:#373734}
.tnode:hover{background:var(--paper-deep)}
.tnode.on{background:var(--ink);color:var(--paper)}
.tnode .layer{font-size:8.5px;letter-spacing:.08em;border:1px solid var(--hair);border-radius:4px;padding:0 4px;color:var(--muted);flex:none;font-family:var(--sans)}
.tnode.on .layer{color:rgba(242,239,235,.7);border-color:rgba(242,239,235,.3)}
.st-dot{width:5px;height:5px;border-radius:50%;margin-left:auto;flex:none}
.st-dot.pub{background:var(--ok)} .st-dot.draft{background:var(--warn)}
.dirty-badge{margin-left:auto;font-size:9px;padding:0 4px;border-radius:4px;border:1px solid var(--warn);color:var(--warn);flex:none;font-family:var(--sans)}
.dirty-badge.new{border-color:var(--ok);color:var(--ok)}
#audit{border-top:1px solid var(--hair-soft);max-height:26%;display:flex;flex-direction:column;flex:none}
#audit .dir-head{padding-bottom:4px}
#audit-body{overflow-y:auto;padding:2px 0 6px}
.a-row{padding:4px 14px;font-size:11px;border-left:2px solid var(--hair);margin:2px 8px;color:var(--muted)}
.a-row b{color:var(--ink);font-weight:600}
.a-row.ok{border-left-color:var(--ok)} .a-row.no{border-left-color:var(--err)}
.left-foot{border-top:1px solid var(--hair-soft);padding:8px 14px;font-size:11px;color:var(--muted);flex:none}
.left-foot .row{display:flex;justify-content:space-between;padding:1px 0}
.left-foot .row span:last-child{font-family:var(--mono);font-size:10px;color:var(--faint)}

/* 中央 */
.center{flex:1;display:flex;flex-direction:column;min-width:0}
.file-tabs{display:flex;align-items:flex-end;border-bottom:1px solid var(--hair);padding:0 12px;background:var(--paper-deep);height:38px;flex:none;overflow-x:auto}
.ftab{display:flex;align-items:center;gap:8px;padding:0 14px;height:32px;font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid transparent;border-bottom:none;border-radius:8px 8px 0 0;margin-bottom:-1px;cursor:pointer;white-space:nowrap}
.ftab.on{background:var(--paper);border-color:var(--hair);color:var(--ink)}
.ftab .fx{color:var(--faint);font-size:12px;padding:0 2px}
.ftab .fx:hover{color:var(--err)}
.ftab .dirty{width:6px;height:6px;border-radius:50%;background:var(--warn);flex:none}
.ws-head{display:flex;align-items:center;gap:12px;padding:12px 20px 0;flex:none}
.ws-title{font-size:15px;font-weight:700}
.ws-title .mono{font-size:11px;color:var(--muted);font-weight:400;margin-left:8px}
.ws-ver{font-family:var(--mono);font-size:10px;color:var(--warn);border:1px solid rgba(154,106,20,.4);border-radius:99px;padding:2px 9px}
.ws-ver.published{color:var(--ok);border-color:rgba(31,138,76,.4)}
.sub-tabs{display:flex;gap:2px;padding:10px 20px 0;border-bottom:1px solid var(--hair);flex:none}
.stab{font-size:12px;color:var(--muted);padding:7px 14px;border-bottom:2px solid transparent;margin-bottom:-1px;cursor:pointer;background:none;border-top:none;border-left:none;border-right:none}
.stab.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
.stab:hover{color:var(--ink)}
.ws-body{flex:1;overflow-y:auto;padding:20px 24px 40px}

.sec-title{font-size:13px;font-weight:700;margin:22px 0 8px;display:flex;align-items:center;gap:10px}
.sec-title:first-child{margin-top:0}
.sec-title .tlabel{flex:none}
.note{font-size:11.5px;color:var(--muted);margin-top:8px}

.attr-table{width:100%;border-collapse:collapse;background:rgba(255,255,255,.45);border:1px solid var(--hair);border-radius:10px;overflow:hidden}
.attr-table th{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:left;padding:9px 14px;border-bottom:1px solid var(--hair)}
.attr-table td{padding:9px 14px;border-bottom:1px solid var(--hair-soft);font-size:12px;vertical-align:middle}
.attr-table tr:last-child td{border-bottom:none}
.attr-table .fn{font-family:var(--mono);font-size:11.5px;font-weight:600}
.attr-table .ft{font-family:var(--mono);font-size:11px;color:var(--muted)}
.pk{font-family:var(--mono);font-size:9px;color:var(--warn);border:1px solid rgba(154,106,20,.4);border-radius:4px;padding:0 4px;margin-left:6px}
.std-cell{font-family:var(--mono);font-size:11px}
.std-cell.bound{color:var(--ok)} .std-cell.unbound{color:var(--warn)} .std-cell.skip{color:var(--faint)}

.lint-list{border:1px solid var(--hair);border-radius:10px;overflow:hidden;background:rgba(255,255,255,.45)}
.lint-row{display:flex;gap:10px;padding:8px 14px;border-bottom:1px solid var(--hair-soft);font-size:12px;align-items:baseline}
.lint-row:last-child{border-bottom:none}
.lint-row .lr-st{font-family:var(--mono);flex:none;width:14px}
.lint-row .lr-st.ok{color:var(--ok)} .lint-row .lr-st.warn{color:var(--warn)} .lint-row .lr-st.err{color:var(--err)}
.lint-row .lr-note{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--muted);text-align:right}

.er-box{border:1px solid var(--hair);border-radius:10px;background:rgba(255,255,255,.45);padding:18px;overflow-x:auto}
.ddl-view{background:var(--term-bg);color:#d7dcd2;border-radius:10px;font-family:var(--mono);font-size:11.5px;line-height:1.75;padding:16px 18px;white-space:pre;overflow-x:auto}
.code-editor{width:100%;min-height:360px;background:var(--term-bg);color:#d7dcd2;border-radius:10px;border:1px solid var(--hair);font-family:var(--mono);font-size:11.5px;line-height:1.75;padding:16px 18px;white-space:pre;overflow:auto;tab-size:2;resize:vertical}
.ddl-view .cm{color:var(--term-green)}
.ddl-view .an{color:#e8b04b}
/* V13 · .ops 执行序列（拓扑分层 + 并行组） */
.ops-layers{display:flex;align-items:stretch}
.ops-layer{flex:1;border:1px solid var(--hair);border-radius:10px;background:rgba(255,255,255,.6);padding:10px;min-width:150px}
.ops-layer-head{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--muted);display:flex;justify-content:space-between;margin-bottom:8px;text-transform:uppercase}
.ops-job{border:1px solid var(--hair-soft);border-radius:8px;padding:7px 9px;margin-bottom:6px;background:var(--paper)}
.ops-job:last-child{margin-bottom:0}
.ops-jt{font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:1px 6px;border-radius:99px;border:1px solid var(--hair);color:var(--muted)}
.ops-jt.etl{color:#0a7a34;border-color:rgba(10,122,52,.35)}
.ops-jt.flashsync{color:#7a4dbb;border-color:rgba(122,77,187,.35)}
.ops-jt.ltstask{color:#9a6a14;border-color:rgba(154,106,20,.4)}
.ops-jn{font-weight:600;font-size:12px;margin-top:4px}
.ops-jp{font-family:var(--mono);font-size:10px;color:var(--muted);word-break:break-all}
.ops-jc{font-family:var(--mono);font-size:10px;color:var(--ok);margin-top:2px}
.ops-arrow{display:flex;align-items:center;padding:0 8px;color:var(--faint);font-size:14px}

.pub-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pub-card{border:1px solid var(--hair);border-radius:10px;background:rgba(255,255,255,.45);padding:14px 16px}
.pub-card h4{font-size:12px;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.pub-state{display:flex;align-items:center;gap:10px;padding:6px 0}
.pub-state .big{font-size:14px;font-weight:700}
.pub-state .big.no{color:var(--warn)} .pub-state .big.yes{color:var(--ok)}
.ver-row{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--hair-soft);font-size:12px;align-items:baseline}
.ver-row:last-child{border:none}
.ver-row .v-no{font-family:var(--mono);font-size:10.5px;color:var(--muted);width:38px;flex:none}
.ver-row .v-t{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--faint)}
.btn{padding:6px 14px;border-radius:99px;font-size:11px;font-weight:500;border:1px solid var(--ink)}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.primary:hover{opacity:.82}
.btn.danger{border-color:var(--err);color:var(--err)}
.btn.mini{margin-left:8px;padding:2px 9px;font-size:10px;border-color:var(--hair);color:var(--ink);background:#fff}
.btn.mini:hover{background:var(--paper)}
.dir-head .btn.mini{margin-left:auto}

.jobref{display:flex;gap:8px;align-items:center;font-size:11px;padding:6px 8px;border:1px solid var(--hair);border-radius:6px;margin-top:6px;background:rgba(255,255,255,.45)}
.jobref .mono{color:var(--muted)}

/* 右栏 · Agent */
.agent-rail{width:384px;flex:none;border-left:1px solid var(--hair);display:flex;flex-direction:column;min-height:0}
.anchor-bar{padding:10px 16px;border-bottom:1px solid var(--hair);display:flex;align-items:center;gap:8px;flex:none}
.anchor-bar .a-dot{width:7px;height:7px;border-radius:50%;background:var(--ink);flex:none}
.anchor-bar .a-txt{font-size:11px;color:var(--muted)}
.anchor-bar .a-obj{font-family:var(--mono);font-size:11px;color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-head{padding:12px 16px 10px;border-bottom:1px solid var(--hair-soft);flex:none}
.agent-head .a-name{font-size:13px;font-weight:700;display:flex;align-items:center;gap:8px}
.agent-head .a-sub{font-size:11px;color:var(--muted);margin-top:5px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.agent-head .model-controls{display:flex;align-items:center;gap:6px;flex:none}
.agent-head select{font-size:10px;border:1px solid var(--hair);background:#fff;color:var(--muted);border-radius:6px;padding:2px 6px;font-family:var(--sans)}
.agent-head #provider-sel,.agent-head #model-sel{max-width:120px}
.agent-head #session-select{max-width:110px}
.agent-head select:focus{outline:none;border-color:var(--ink)}
.agent-stream{flex:1;overflow-y:auto;padding:14px 14px 24px;min-height:0}
.a-msg{margin:0 2px 14px}
.a-who{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.a-ava{width:16px;height:16px;border-radius:5px;flex:none}
.a-ava.human{background:var(--ink)}
.a-ava.agent{background:var(--term-bg);position:relative}
.a-ava.agent::after{content:"";position:absolute;inset:5px;background:var(--term-green);border-radius:2px}
.a-ava.plugin{background:var(--paper-deep);border:1px solid var(--hair)}
.a-who .who{font-size:11px;font-weight:600}
.a-body{font-size:12.5px;color:#282826;white-space:pre-wrap;line-height:1.6}
.a-msg.user .a-body{background:var(--paper-deep);padding:8px 12px;border-radius:8px}
/* 运行心跳：固定在输入区上方的状态条，不占会话流、不劫持滚动 */
.a-busybar{display:flex;align-items:center;gap:8px;padding:6px 12px;margin:0 2px 6px;border:1px dashed var(--hair);border-radius:8px;font-size:11px;color:var(--muted);background:var(--paper)}
.a-busybar .pulse{width:7px;height:7px;border-radius:50%;background:var(--term-green);animation:tpulse 1.1s ease-in-out infinite;flex:none}
@keyframes tpulse{0%,100%{opacity:.25}50%{opacity:1}}
/* Agent 回复 Markdown 渲染 */
.a-body.md h1,.a-body.md h2,.a-body.md h3{font-size:12.5px;font-weight:700;margin:10px 0 4px}
.a-body.md h1{font-size:13.5px}
.a-body.md p{margin:5px 0}
.a-body.md strong{font-weight:700}
.a-body.md code{font-family:var(--mono);font-size:10.5px;background:var(--paper-deep);padding:1px 4px;border-radius:4px}
.a-body.md pre{background:var(--term-bg);color:var(--term-green);border-radius:8px;padding:8px 10px;margin:6px 0;overflow-x:auto;font-family:var(--mono);font-size:10.5px;line-height:1.6}
.a-body.md pre code{background:none;padding:0;color:inherit}
.a-body.md table{border-collapse:collapse;margin:6px 0;font-size:11px;width:100%}
.a-body.md th,.a-body.md td{border:1px solid var(--hair);padding:3px 8px;text-align:left}
.a-body.md th{background:var(--paper-deep);font-weight:600}
.a-body.md ul,.a-body.md ol{margin:5px 0 5px 18px}
.a-body.md li{margin:2px 0}
.term{background:var(--term-bg);border-radius:9px;margin:0 2px 12px;overflow:hidden;font-family:var(--mono);font-size:10.5px;line-height:1.7;color:var(--term-green)}
.term-head{display:flex;align-items:center;gap:7px;padding:5px 12px;border-bottom:1px solid rgba(74,222,128,.14);color:var(--term-dim);font-size:9px;letter-spacing:.14em;text-transform:uppercase}
.term-body{padding:7px 12px 9px;max-height:200px;overflow-y:auto}
.tline{white-space:pre-wrap;word-break:break-all}
.tline.err{color:#ff5f6e}
.a-card{border:1px solid var(--err);border-radius:9px;margin:0 2px 12px;overflow:hidden;background:rgba(255,255,255,.5)}
.a-card-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--hair-soft)}
.a-card-head .c-title{font-weight:600;font-size:12px}
.a-card-body{padding:10px 12px;font-size:11px;color:var(--muted)}
.a-verdict{display:flex;gap:8px;padding:0 12px 12px}
.a-verdict .btn{flex:1;text-align:center}
.a-card.decision{border-color:rgba(154,106,20,.6);box-shadow:0 2px 10px rgba(154,106,20,.12)}
.a-card.decision .a-card-head{background:rgba(154,106,20,.08)}
/* V15.2 · 会话流结构化卡片（对齐 DSH-Desktop：工具调用/结果/思考/步骤均为可折叠分段） */
.a-fold{border:1px solid var(--hair);border-radius:10px;margin:0 2px 8px;background:rgba(255,255,255,.55);overflow:hidden}
.a-fold-head{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 10px;font-size:11.5px;color:var(--ink);cursor:pointer;user-select:none}
.a-fold-head:hover{background:var(--paper-deep)}
.a-fold-head .f-dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--faint);transition:background .3s}
.a-fold-head .f-dot.run{background:var(--term-green);animation:tpulse 1.1s ease-in-out infinite}
.a-fold-head .f-dot.ok{background:var(--ok)}
.a-fold-head .f-dot.err{background:var(--err)}
.a-fold-head .f-name{font-family:var(--mono);font-size:10.5px;font-weight:600;flex:none}
.a-fold-head .f-onto{font-size:8.5px;color:var(--muted);border:1px solid var(--hair);border-radius:99px;padding:0 6px;font-family:var(--mono);flex:none}
.a-fold-head .f-sub{font-size:10.5px;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono)}
.a-fold-head .f-chev{margin-left:auto;color:var(--faint);font-size:10px;flex:none;transition:transform .2s}
.a-fold[open] .f-chev{transform:rotate(90deg)}
.a-fold-body{padding:8px 10px;border-top:1px solid var(--hair-soft);font-size:11px;color:var(--muted)}
.a-fold-body pre{margin:0;white-space:pre-wrap;word-break:break-all;font-family:var(--mono);font-size:10px;line-height:1.6;color:#373734}
.a-fold-body .f-json{max-height:240px;overflow:auto;background:var(--paper);border:1px solid var(--hair-soft);border-radius:7px;padding:8px 10px;white-space:pre;font-family:var(--mono);font-size:10px;line-height:1.55;color:#373734}
.a-fold-body .f-json .jk{color:#7a4dbb}
.a-fold-body .f-json .js{color:#0a7a34}
.a-fold-body .f-json .jn{color:#9a6a14}
.a-fold-body .f-json .jb{color:#b02a44}
.a-fold-body .f-err{color:var(--err)}
.a-fold-body .f-summary{font-size:10.5px;color:var(--muted);padding-bottom:6px;font-family:var(--mono)}
/* 步骤块：只做分组标题，不自带边框重叠 */
.a-step{display:flex;align-items:center;gap:8px;margin:14px 0 6px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.a-step::after{content:"";flex:1;height:1px;background:var(--hair-soft)}
/* 思考块：比工具卡更弱化的折叠 */
.a-think .f-name{color:var(--faint)}
.a-think .f-body-text{white-space:pre-wrap;color:var(--muted);font-size:11px;line-height:1.7}
/* 扫描结论卡片（V15.3） */
.sv-card{border:1px solid var(--hair);border-radius:11px;margin:12px 0 4px;background:rgba(255,255,255,.6);overflow:hidden}
.sv-card.ok{border-color:rgba(31,138,76,.5)}
.sv-card.warn{border-color:rgba(154,106,20,.5)}
.sv-card.err{border-color:rgba(176,42,68,.5)}
.sv-head{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--hair-soft);background:var(--paper)}

      <div class="a-name"><span class="a-orb"></span>Data Agent <span class="a-status" id="agent-status">就绪</span><button class="a-pop" id="a-pop" title="弹出为浮窗 / 停靠回侧栏"><svg viewBox="0 0 12 12"><path d="M4 2h6v6M8 8L2 2M2 4v6h6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg></button></div>
      <div class="a-sub"><span>写操作需你确认</span><span class="model-controls"><select id="provider-sel" title="切换模型 provider"></select><select id="model-sel" title="切换模型"></select><select id="session-select"><option value="">新会话</option></select></span></div>
    </div>
    <div class="agent-stream" id="chat"></div>
    <div class="agent-composer">
      <div class="a-busybar" id="busybar" style="display:none"><span class="pulse"></span><span id="busybar-text"></span></div>
      <div class="a-chips" id="a-chips"></div>
      <div class="a-inputbar">
        <textarea id="prompt" rows="1" placeholder="就锚定对象提问或下指令…"></textarea>
        <button class="a-send" id="send">↑</button>
      </div>
      <div class="a-meta"><span class="led"></span><span id="session-id"></span><span>写操作 · 需确认</span></div>
    </div>
  </aside>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= 状态 ================= */
let sessionId = null, lastSeq = -1;
let mode = 'model';                       // model | dev（左栏双空间）
let active = { kind: null, file: null };  // kind: model | repo
let openFiles = [];                       // [{kind, file}]
let activeTab = null;
let repoState = { branches: [], current: null, tree: [] };
let modelsCache = [];
let testResults = {};                     // path -> dryrun 结果（UI 展示态，数据源是他的 hisDryrun）
let anchorObj = '—';
let auditEvents = [];

const $ = (s) => document.querySelector(s);
const api = (p, o) => fetch(p, o).then((r) => r.json());
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// 本体对象类型作用域查询工具：工具名是 snake_case（LLM schema 不允许点号），
// 显示时转回 ObjectType.method(arg) 形式 —— 会话流打印出 Policy.getPolicies(inst/dbscript)。
// 本体对象类型作用域查询工具：工具名是 snake_case（LLM schema 不允许点号），
// 显示时转回 ObjectType.method(arg) 形式 —— 会话流打印出 Policy.getPolicies(inst/dbscript)。
const ONTO_Q = {
  policy_get_policies: ['Policy', 'getPolicies'],
  policy_get_rules: ['Policy', 'getRules'],
  rule_get_implementations: ['Rule', 'getImplementations'],
  platform_get_policies: ['PlatformInstance', 'getPolicies'],
  platform_get_rules: ['PlatformInstance', 'getRules'],
  platform_get_job_types: ['PlatformInstance', 'getJobTypes'],
  job_type_get_platform: ['JobType', 'getPlatform'],
  rule_impl_get_job_type: ['RuleImpl', 'getJobType'],
  model_get_fields: ['Model', 'getFields'],
  model_get_jobs: ['Model', 'getImplementingJobs'],
};
// 本体 Function 工具白名单（无 ontology_ 前缀，用名单标记 [ontology-function] 徽标）
const ONTO_TOOLS = new Set([
  'get_anchored_object', 'get_object_type', 'get_links',
  'policy_get_policies', 'policy_get_rules', 'rule_get_implementations',
  'platform_get_policies', 'platform_get_rules', 'platform_get_job_types',
  'job_type_get_platform', 'rule_impl_get_job_type', 'model_get_fields', 'model_get_jobs',
  'list_functions', 'list_actions', 'classify_job', 'policies_for', 'rules_for',
  'get_scan_plan', 'check_consistency', 'get_lineage_upstream', 'get_lineage_downstream',
  'get_impact', 'explain_finding', 'propose',
]);
function ontoToolLabel(name, argsObj) {
  const m = ONTO_Q[name];
  const argVal = argsObj && (argsObj.platform || argsObj.policy || argsObj.rule || argsObj.impl || argsObj.jobType || argsObj.model || '');
  return m ? m[0] + '.' + m[1] + '(' + argVal + ')' : name;
}
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('show'), 2200); }

const MODEL_TABS = [['design','模型设计'],['er','ER 图'],['ddl','DDL'],['publish','资产发布']];
const ETL_TABS = [['flow','可视化'],['code','代码'],['test','测试运行'],['lineage','血缘影响']];
const DAG_TABS = [['graph','依赖图'],['yaml','配置代码']];
const OPS_TABS = [['seq','执行序列'],['dsl','DSL 代码'],['pair','配对校验']];
const SCRIPT_TABS = [['code','脚本代码'],['scan','扫描'],['lineage','血缘影响']];
const SVC_TABS = [['code','定义代码'],['lineage','血缘影响']];

/* ================= 左栏：空间切换 ================= */
document.querySelectorAll('#menu button[data-mode]').forEach((b) => b.addEventListener('click', () => {
  mode = b.dataset.mode;
  document.querySelectorAll('#menu button').forEach((x) => x.classList.toggle('on', x === b));
  $('#model-view').style.display = mode === 'model' ? 'flex' : 'none';
  $('#repo-view').style.display = mode === 'dev' ? 'flex' : 'none';
  $('#crumb').textContent = mode === 'model' ? '财税域 · 数据建模' : `财税域 · 数据开发 · ${repoState.current ?? ''}`;
  renderChips();
}));

/* ================= 租户（V11 · 顶栏下拉，全链路跟随） ================= */
let tenantState = { tenants: [], current: { id: 'finance', repo: 'finance-dw', dataTenant: true } };
async function loadTenants() {
  const d = await api('/api/tenants');
  if (d.error) return;
  tenantState = d;
  $('#tenant-label').textContent = d.current.id;
  $('#tenant-menu').innerHTML = d.tenants.map((t) =>
    `<button class="dd-item ${t.id === d.current.id ? 'on' : ''}" data-t="${t.id}">${t.id} · ${esc(t.cn)}<span class="dd-repo">${esc(t.repo)}</span></button>`).join('');
  document.querySelectorAll('#tenant-menu .dd-item').forEach((b) => b.addEventListener('click', () => switchTenant(b.dataset.t)));
}
$('#tenant-btn').addEventListener('click', (e) => {
  e.stopPropagation();
  const m = $('#tenant-menu');
  m.style.display = m.style.display === 'none' ? 'block' : 'none';
});
document.addEventListener('click', () => { $('#tenant-menu').style.display = 'none'; });
async function switchTenant(t) {
  $('#tenant-menu').style.display = 'none';
  if (t === tenantState.current.id) return;
  const r = await api('/api/repo/tenant', { method: 'POST', body: JSON.stringify({ tenant: t }) });
  if (r.error) { toast('租户切换失败: ' + r.error); return; }
  tenantState.current = r.current;
  await loadTenants();
  toast(`已切到租户 ${t}（${r.current.cn}）`);
  // 全链路跟随：仓树/页签/工作区/面包屑/快捷指令
  invalidateCaches();
  openFiles = openFiles.filter((f) => f.kind !== 'repo');
  if (active.kind === 'repo') active = { kind: null, file: null };
  await loadRepoTree(); renderFileTabs(); renderWorkspace(); renderChips();
  if (r.current.dataTenant) setAnchor({ branch: r.branch, dir: '.' });
}
const inDataTenant = () => tenantState.current.dataTenant !== false;

/* ================= 左栏：模型树 ================= */
async function loadModels() {
  const d = await api('/api/models');
  modelsCache = d.models;
  $('#std-ver').textContent = d.stdLibVersion + ' · 已连接';
  $('#model-tree').innerHTML = `<div class="tree-domain"><div class="td-head">财税域<span class="cnt">${d.models.length}</span></div>
    ${d.models.map((m) => `<button class="tnode ${active.kind === 'model' && m.file === active.file ? 'on' : ''}" onclick="openFile('model','${m.file}')">
      <span class="layer">${m.layer}</span>${m.file}
      <span class="st-dot ${m.published ? 'pub' : 'draft'}"></span></button>`).join('')}</div>`;
}

/* ================= 左栏：代码仓树（V10 分包投影 + 扫描点） ================= */
async function loadRepoTree() {
  repoState = await api('/api/repo/tree');
  const sel = $('#branch-sel');
  sel.innerHTML = repoState.branches.map((b) => `<option value="${b}" ${b === repoState.current ? 'selected' : ''}>⑂ ${b}</option>`).join('');
  const tn = repoState.tenant ?? tenantState.current;
  if (mode === 'dev') $('#crumb').textContent = `tenant ${tn.id} · ${tn.repo} · ${repoState.current}`;
  // 空租户（V11）：暂无作业占位
  if (!repoState.tree.length) {
    $('#repo-tree').innerHTML = `<div class="empty-tenant" style="margin:30px auto;padding:0 16px">
      <div class="et-ico">◌</div><p style="font-size:12px;font-weight:600">暂无作业</p>
      <p class="note">租户 ${esc(tn.id)}（${esc(tn.cn ?? '')}）的仓 ${esc(tn.repo)} 为空。<br>权限与数据按租户隔离，新建作业请切回数据租户。</p></div>`;
    return;
  }
  // 按分包投影分组：etl/ → 主力 ETL 平台；dag/ → 调度平台；etl_legacy/ → 未接入只读
  const groups = {};
  for (const e of repoState.tree) {
    const top = e.path.split('/')[0];
    (groups[top] ??= []).push(e);
  }
  $('#repo-tree').innerHTML = Object.entries(groups).map(([top, files]) => {
    const pkg = (repoState.packages ?? []).find((p) => p.prefix === top + '/');
    const off = pkg && !pkg.connected;
    return `<div class="tree-domain"><div class="td-head mono">${top}/
      ${pkg ? `<span class="pkg-badge ${off ? 'off' : ''}">${off ? '未接入 · 只读' : esc(pkg.platform)}</span>` : ''}
      <span class="cnt">${files.length}</span></div>
    ${files.map((e) => {
      const legacy = off || e.pkg?.connected === false;
      return `<button class="tnode ${legacy ? 'legacy' : ''} ${active.kind === 'repo' && e.path === active.file ? 'on' : ''}" data-path="${esc(e.path)}" data-legacy="${legacy ? 1 : ''}">
      <span class="layer ${legacy ? 'off' : ''}">${e.kind === 'dag' ? 'DAG' : e.kind === 'ops' ? 'OPS' : 'ETL'}</span>${e.path.split('/').pop()}
      ${!legacy && e.scan ? `<span class="scan-dot ${e.scan}" title="CICD 扫描 · 权威报告">${e.scan === 'pass' ? '✓' : '⚠差异'}</span>` : ''}
      ${e.stale ? '<span class="dirty-badge" title="模型 ' + esc(e.stale.model) + ' 已升至 ' + esc(e.stale.currentVersion) + '，本作业基线 ' + esc(e.stale.baseVersion) + '">模型已更新</span>' : ''}
      ${e.uncommitted ? '<span class="dirty-badge new">新增</span>' : e.dirty ? `<span class="dirty-badge">${e.dirty}</span>` : ''}
    </button>`; }).join('')}</div>`;
  }).join('');
  document.querySelectorAll('#repo-tree .tnode').forEach((b) => b.addEventListener('click', () => {
    if (b.dataset.legacy) { toast('该平台未接入 Agent 工作范围 · 仅只读浏览'); return; }
    openFile('repo', b.dataset.path);
  }));
}
$('#branch-sel').addEventListener('change', async (e) => {
  const r = await api('/api/repo/checkout', { method: 'POST', body: JSON.stringify({ branch: e.target.value }) });
  if (r.error) { toast('分支切换失败: ' + r.error); await loadRepoTree(); return; }
  repoState = { ...repoState, ...r };
  toast('已切到分支 ' + e.target.value);
  invalidateCaches();
  openFiles = openFiles.filter((f) => f.kind !== 'repo');
  if (active.kind === 'repo') active = { kind: null, file: null };
  await loadRepoTree(); renderFileTabs(); renderWorkspace();
  setAnchor({ branch: e.target.value, dir: '.' });
});

/* ================= 文件页签（多开） ================= */
function openFile(kind, file) {
  // 未接入分包守卫（V10）：只读浏览，不锚定不打开
  if (kind === 'repo') {
    const ent = repoState.tree.find((e) => e.path === file);
    if (ent?.pkg?.connected === false) { toast('该平台未接入 Agent 工作范围 · 仅只读浏览'); return; }
  }
  active = { kind, file };
  if (!openFiles.some((f) => f.kind === kind && f.file === file)) openFiles.push({ kind, file });
  activeTab = null;
  renderFileTabs(); renderWorkspace(); loadModels(); loadRepoTree();
  anchorObj = kind === 'model' ? file : `${repoState.current} · ${file}`;
  $('#anchor-obj').textContent = anchorObj;
  // 切文件/锚点：无条件设后端锚点（不依赖是否有会话）——agent 提问时 get_anchored_object 才能读到正确 current；
  // 之前 if(sessionId) 导致未发过消息就切文件时后端 current 未设 → 前端显示已锚定、后端却报未锚定。
  setAnchor(kind === 'model' ? { file } : { branch: repoState.current, dir: file.split('/').slice(0, -1).join('/') });
}
function renderFileTabs() {
  $('#file-tabs').innerHTML = openFiles.map((f) => {
    const label = f.kind === 'repo' ? f.file.split('/').pop() : f.file;
    const ent = f.kind === 'repo' ? repoState.tree.find((e) => e.path === f.file) : null;
    const dirty = ent && (ent.dirty || ent.uncommitted);
    const on = active.kind === f.kind && active.file === f.file;
    return `<div class="ftab ${on ? 'on' : ''}" data-kind="${f.kind}" data-f="${esc(f.file)}">
      ${esc(label)}${dirty ? '<span class="dirty" title="有未提交修改"></span>' : ''}
      ${openFiles.length > 1 ? `<span class="fx" data-x="${esc(f.file)}">✕</span>` : ''}</div>`;
  }).join('');
  document.querySelectorAll('.ftab').forEach((t) => t.addEventListener('click', (e) => {
    const kind = t.dataset.kind, file = t.dataset.f;
    if (e.target.dataset.x) {
      e.stopPropagation();
      openFiles = openFiles.filter((x) => !(x.file === e.target.dataset.x && x.kind === kind));
      if (active.file === e.target.dataset.x && active.kind === kind) {
        const next = openFiles[0];
        active = next ? { kind: next.kind, file: next.file } : { kind: null, file: null };
        activeTab = null;
      }
      renderFileTabs(); renderWorkspace(); return;
    }
    active = { kind, file }; activeTab = null;
    renderFileTabs(); renderWorkspace();
  }));
}

/* ================= 中央：工作区 ================= */
function renderSubTabs(kind, fkind) {
  const tabs = kind === 'model' ? MODEL_TABS : fkind === 'dag' ? DAG_TABS : fkind === 'ops' ? OPS_TABS : fkind === 'script' ? SCRIPT_TABS : fkind === 'svc' ? SVC_TABS : ETL_TABS;
  if (!tabs.some(([k]) => k === activeTab)) activeTab = tabs[0][0];
  $('#sub-tabs').innerHTML = tabs.map(([k, label]) => `<button class="stab ${k === activeTab ? 'on' : ''}" data-tab="${k}">${label}</button>`).join('');
  $('#sub-tabs').querySelectorAll('.stab').forEach((t) => t.addEventListener('click', () => { activeTab = t.dataset.tab; renderWorkspace(); }));
}
async function renderWorkspace() {
  if (!active.kind) {
    $('#ws-title').textContent = '未选择对象'; $('#ws-ver').style.display = 'none';
    $('#ws-domain').innerHTML = ''; $('#sub-tabs').innerHTML = ''; $('#ws-body').innerHTML = '<p class="note">从左侧目录选择模型或作业文件。</p>';
    return;
  }
  if (active.kind === 'model') return renderModelWs();
  return renderRepoWs();
}

/* ----- 模型工作间 ----- */
async function renderModelWs() {
  renderSubTabs('model');
  const m = await api('/api/models/' + encodeURIComponent(active.file));
  if (m.error) { $('#ws-body').textContent = m.error; return; }
  $('#ws-title').innerHTML = `${esc(m.cn)}<span class="mono">${esc(m.file)}</span>`;
  const v = $('#ws-ver'); v.style.display = '';
  v.textContent = (m.published ? '已发布 · ' : '') + m.version;
  v.className = 'ws-ver' + (m.published ? ' published' : '');
  $('#ws-domain').innerHTML = `<span class="tlabel">${esc(m.domain)}</span> <span class="tlabel">${esc(m.layer)}</span>`;
  if (activeTab === 'design') return viewDesign(m);
  if (activeTab === 'er') return viewER(m);
  if (activeTab === 'ddl') return viewDDL(m);
  return viewPublish(m);
}
function lintListRows(m, lint) {
  const rows = [['命名规范', 'ok', '符合 R-001~R-068']];
  const unb = m.fields.filter((f) => !f.std && !f.skip).length;
  rows.push(['数据标准绑定率', unb > 0 ? 'warn' : 'ok', unb > 0 ? `缺 ${unb} 项 · 建议补齐` : '全部绑定或依规免绑']);
  for (const i of lint?.issues ?? []) {
    if (i.kind === 'type-mismatch') rows.push(['数据类型对齐', 'warn', i.message]);
    else if (i.kind === 'unbound-no-hit') rows.push([`标准候选 · ${i.field}`, 'warn', '库中无候选 · 需起草']);
  }
  if (!rows.some((r) => r[0] === '数据类型对齐')) rows.push(['数据类型对齐', 'ok', '与标准定义一致']);
  rows.push(['分区策略', 'ok', 'dt 月分区 yyyyMM']);
  return rows.map((r) => `<div class="lint-row"><span class="lr-st ${r[1]}">${r[1] === 'ok' ? '✓' : '!'}</span>${esc(r[0])}<span class="lr-note">${esc(r[2])}</span></div>`).join('');
}
async function viewDesign(m) {
  const lint = await api('/api/models/' + encodeURIComponent(active.file) + '/lint');
  const bound = m.fields.filter((f) => f.std).length;
  const jobRefs = (m.jobRefs ?? []).map((r) => `
    <div class="jobref"><span class="mono">⚙ ${esc(r.job)}</span><span class="mono">${esc(r.dag ?? '')}</span>
      <span class="mono" style="margin-left:auto">${esc(r.commitId ?? '')}</span></div>`).join('');
  $('#ws-body').innerHTML = `<div class="sec-title">属性设计 <span class="tlabel">${bound}/${m.fields.length} 已绑定数据标准</span></div>
    <table class="attr-table"><thead><tr><th>字段</th><th>类型</th><th>说明</th><th>数据标准</th><th>约束</th></tr></thead><tbody>
    ${m.fields.map((f) => `<tr>
      <td><span class="fn">${esc(f.n)}</span>${f.pk ? '<span class="pk">PK</span>' : ''}</td>
      <td><span class="ft">${esc(f.t)}</span></td>
      <td style="color:var(--muted)">${esc(f.c)}</td>
      <td>${f.std ? `<span class="std-cell bound">✓ ${esc(f.std)}</span>` : f.skip ? `<span class="std-cell skip">— ${esc(f.skip)}</span>` : '<span class="std-cell unbound">未绑定</span>'}</td>
      <td style="font-family:var(--mono);font-size:10.5px;color:var(--muted)">${f.n === 'dt' ? 'PARTITION' : f.pk ? 'NOT NULL' : '—'}</td>
    </tr>`).join('')}</tbody></table>
    <p class="note">绑定与属性修改交给右侧 Agent 批量处理；提交版本与资产发布需你确认。</p>
    <div class="sec-title">规范性检查 <span class="tlabel">规则 · 财税数据元 v1.2</span></div>
    <div class="lint-list">${lintListRows(m, lint)}</div>
    ${jobRefs ? `<div class="sec-title">生产作业引用 <span class="tlabel">开发空间回写</span></div>${jobRefs}` : ''}`;
}
/* ----- V12 · ER 图（AntV X6 · HTML shape 表节点 · 属性级锚定） ----- */
let erGraph = null;      // X6 Graph 实例（重渲染纪律：先 dispose 再重建）
let erDetails = {};      // file -> 模型详情（节点内容单一事实源）
let erSel = null;        // 属性级锚定：{file, field, fieldData}
const ER_W = 286, ER_HEAD = 40, ER_ROW = 24;
async function viewER() {
  // 节点内容从模型服务实时拉取（单一事实源），3 实体全量渲染
  erDetails = {};
  await Promise.all(modelsCache.map(async (x) => {
    const d = await api('/api/models/' + encodeURIComponent(x.file));
    if (!d.error) erDetails[x.file] = d;
  }));
  $('#ws-body').innerHTML = `<div class="sec-title">ER 图 <span class="tlabel">AntV X6 · 属性行可点击锚定</span></div>
    <div class="er-x6-box"><div id="er-x6" style="width:100%;height:660px"></div></div>
    <p class="note">ER 图由开源图引擎 AntV X6 渲染：<b>每个属性行都可点击</b>——点击即把右侧 Agent 锚定到「模型 · 字段」粒度并行高亮；未绑定标准的行内可直接点「＋ 补全标准」（gated，需你确认）；点实体头锚定整个模型。绑标准、改字段后此图整图重建同步。</p>`;
  renderErGraph();
}
function erNodeHTML(d) {
  const rows = (d.fields ?? []).map((f) => `<div class="er-row" data-er-field="${esc(d.file)}|${esc(f.n)}">
    <span class="ft">${esc(f.t)}</span><span class="fn2">${esc(f.n)}</span>
    ${f.pk ? '<span class="pk2">PK</span>' : ''}
    ${f.std ? `<span class="std2">✓ ${esc(f.std)}</span>`
      : f.skip ? `<span class="std2 skip2">— 免绑</span>`
      : `<button class="std2 add" data-er-add="${esc(d.file)}|${esc(f.n)}">＋ 补全标准</button>`}
  </div>`).join('');
  return `<div class="er-node ${d.file === active.file ? 'main' : ''}" data-er-node="${esc(d.file)}">
    <div class="er-head" data-er-head="${esc(d.file)}"><div class="en">${esc(d.model ?? d.name)}</div>
    <div class="es"><span>${esc(d.cn ?? '')}</span><span>${esc(d.version)}${d.published ? ' · 已发布' : ' · 草稿'}</span></div></div>
    ${rows}</div>`;
}
function renderErGraph() {
  const el = document.getElementById('er-x6');
  if (!el || !window.X6) { if (el) el.innerHTML = '<p class="note">图引擎未加载（/vendor/x6.js）</p>'; return; }
  // 重渲染纪律：先 dispose 再重建，避免状态残留
  if (erGraph) { erGraph.dispose(); erGraph = null; }
  // shape 注册是全局的，重复注册会抛错——只注册一次（对齐原型纪律）
  if (!window._erShapeReg) {
    X6.Shape.HTML.register({ shape: 'er-table', width: ER_W, height: 120, effect: ['data'], html: (cell) => erNodeHTML(erDetails[cell.getData().file]) });
    window._erShapeReg = true;
  }
  const g = new X6.Graph({ container: el, background: { color: '#fafaf9' }, interacting: false });
  const files = Object.keys(erDetails);
  const hOf = (f) => ER_HEAD + (erDetails[f].fields?.length ?? 0) * ER_ROW + 12;
  const dims = Object.fromEntries(files.map((f) => [f, hOf(f)]));
  // 布局：按分层分列（ods/dim → dwd → dws/ads 从左到右），列内按实际高度堆叠——
  // 不能再按 dim_/非 dim_ 两列写死，多张建表或新层模型会同坐标重叠
  const COL_ORDER = ['ods', 'dim', 'dwd', 'dws', 'ads'];
  const cols = {};
  for (const f of files) { const l = f.split('_')[0]; (cols[l] ??= []).push(f); }
  const pos = {};
  let cx = 30;
  for (const l of COL_ORDER) {
    const col = cols[l];
    if (!col) continue;
    let cy = 24;
    for (const f of col) { pos[f] = { x: cx, y: cy }; cy += dims[f] + 56; }
    cx += ER_W + 160;
  }
  for (const file of files) {
    const d = erDetails[file];
    g.addNode({ shape: 'er-table', id: d.model ?? d.name, x: pos[file].x, y: pos[file].y, width: ER_W, height: dims[file], data: { file } });
  }
  // 关系线：双方实体在场才画（manhattan 路由 + rounded 连接 + 边标签）
  const has = (f) => files.includes(f);
  const nameOf = (f) => erDetails[f].model ?? erDetails[f].name;
  const mkEdge = (a, aSide, b, bSide, label) => g.addEdge({
    source: { cell: a, anchor: { name: 'midSide', args: { side: aSide } } },
    target: { cell: b, anchor: { name: 'midSide', args: { side: bSide } } },
    router: { name: 'manhattan' }, connector: { name: 'rounded' },
    attrs: { line: { stroke: '#6d6a64', strokeWidth: 1, targetMarker: null } },
    labels: [{ attrs: { label: { text: label, fill: '#6d6a64', fontSize: 10, fontFamily: 'JetBrains Mono, monospace' }, body: { fill: '#fafaf9', stroke: '#e3ded3' } } }],
  });
  if (has('dim_taxpayer.model') && has('dwd_tax_declaration.model')) mkEdge(nameOf('dim_taxpayer.model'), 'right', nameOf('dwd_tax_declaration.model'), 'left', '1 : n · taxpayer_id');
  if (has('dwd_tax_declaration.model') && has('dwd_tax_payment.model')) mkEdge(nameOf('dwd_tax_declaration.model'), 'bottom', nameOf('dwd_tax_payment.model'), 'top', '1 : n · decl_id');
  // interacting:false 不能平移缩放，内容超出视口时必须自动适配，否则列多了看不到/看似重叠
  g.zoomToFit({ padding: 24, maxScale: 1 });
  // 属性行事件委托（真 DOM 可挂事件）
  el.onclick = (ev) => {
    const add = ev.target.closest('[data-er-add]');
    if (add) { // 行内业务入口：＋ 补全标准
      const [file, field] = add.dataset.erAdd.split('|');
      anchorField(file, field);
      const fd = erDetails[file]?.fields?.find((x) => x.n === field);
      send(`给 ${file} 的字段 ${field}（${fd?.c ?? ''}）补全数据标准：先 std_search 找候选，命中则调 model_bind_std 绑定（写操作需我确认），无候选则建议先起草标准`);
      return;
    }
    const row = ev.target.closest('[data-er-field]');
    if (row) { const [file, field] = row.dataset.erField.split('|'); anchorField(file, field); return; }
    const head = ev.target.closest('[data-er-head]');
    if (head) { erSel = null; openFile('model', head.dataset.erHead); }
  };
  erGraph = g;
}

/* 本体推理链 · X6 图（V15.1 对齐 ER 图容器：分层布局 + manhattan 路由 + 边标签） */
let ontoGraph = null;
function ontoNodeHTML(n) {
  const isJob = n.type === 'Job', isRule = n.type === 'Rule';
  return '<div class="onto-node' + (isJob ? ' hit' : '') + (isRule ? ' rule' : '') + '">'
    + '<div class="on-type">' + esc(n.type) + '</div>'
    + '<div class="on-name">' + esc(n.name) + '</div>'
    + (n.sub ? '<div class="on-sub">' + esc(n.sub) + '</div>' : '') + '</div>';
}
function renderOntoChain(chain) {
  const el = document.getElementById('onto-x6');
  if (!el || !window.X6) { if (el) el.innerHTML = '<p class="note">图引擎未加载（/vendor/x6.js）</p>'; return; }
  if (ontoGraph) { ontoGraph.dispose(); ontoGraph = null; }
  if (!window._ontoShapeReg) {
    X6.Shape.HTML.register({ shape: 'onto-node', width: 168, height: 58, effect: ['data'], html: (cell) => ontoNodeHTML(cell.getData()) });
    window._ontoShapeReg = true;
  }
  const g = new X6.Graph({ container: el, background: { color: '#fafaf9' }, interacting: false });
  // 分层布局：按 ObjectType 排 x（Job → JobType → PlatformInstance → Policy → Rule → RuleImpl）
  const rank = { Job: 0, JobType: 1, PlatformInstance: 2, Policy: 3, Rule: 4, RuleImpl: 5 };
  const cols = {};
  for (const n of chain.nodes) { (cols[n.type] ??= []).push(n); }
  const pos = {};
  const RANK_ORDER = ['Job', 'JobType', 'PlatformInstance', 'Policy', 'Rule', 'RuleImpl'];
  let cx = 40;
  const NODE_W = 168, NODE_H = 58;
  for (const t of RANK_ORDER) {
    const col = cols[t];
    if (!col || !col.length) continue;
    // 列内垂直居中：整列高度对齐到最高列，避免某列只有 1 个节点时顶部对齐导致边斜穿
    const colH = col.length * (NODE_H + 26) - 26;
    const maxColH = Math.max(...RANK_ORDER.map((tt) => (cols[tt] || []).length * (NODE_H + 26) - 26));
    let cy = 30 + Math.max(0, (maxColH - colH) / 2);
    for (const n of col) { pos[n.id] = { x: cx, y: cy, col: t }; cy += NODE_H + 26; }
    cx += NODE_W + 130;
  }
  // 未排到的类型兜底（不应发生，防御）
  let tailX = cx;
  for (const n of chain.nodes) {
    if (!pos[n.id]) { pos[n.id] = { x: tailX, y: 30 }; tailX += NODE_W + 130; }
  }
  for (const n of chain.nodes) {
    g.addNode({ shape: 'onto-node', id: n.id, x: pos[n.id].x, y: pos[n.id].y, width: NODE_W, height: NODE_H, data: n });
  }
  // 边：双方都在场才画。用 ports（左右侧锚点）让 fan-out 边从节点左右侧中点进出，
  // 避免默认中心锚点导致多线在节点上汇聚重叠；边标签错开放在中点。
  const hasId = (id) => chain.nodes.some((n) => n.id === id);
  // 统计每个源节点的出边序号，用于错开锚点（dy 偏移）防止多线重叠
  const outCount = {};
  for (const e of chain.edges) outCount[e.from] = (outCount[e.from] || 0) + 1;
  const outSeen = {};
  for (const e of chain.edges) {
    if (!hasId(e.from) || !hasId(e.to)) continue;
    const srcNode = g.getCellById(e.from), dstNode = g.getCellById(e.to);
    const dy = (idx, n) => (n <= 1 ? 0 : (idx - (n - 1) / 2) * 18);
    const si = outSeen[e.from] || 0; outSeen[e.from] = si + 1;
    g.addEdge({
      source: { cell: e.from, anchor: { name: 'midSide', args: { side: 'right', dy: dy(si, outCount[e.from]) } } },
      target: { cell: e.to, anchor: { name: 'midSide', args: { side: 'left', dy: 0 } } },
      router: { name: 'manhattan', args: { padding: 18 } }, connector: { name: 'rounded', args: { radius: 8 } },
      attrs: { line: { stroke: '#6d6a64', strokeWidth: 1.1, targetMarker: { name: 'block', width: 6, height: 6 } } },
      labels: [{ attrs: { label: { text: e.label, fill: '#9a6a14', fontSize: 9, fontFamily: 'JetBrains Mono, monospace' }, body: { fill: '#fafaf9', stroke: '#e3ded3', rx: 4, ry: 4 } }, position: { distance: 0.5, offset: 14 } }],
    });
  }
  g.zoomToFit({ padding: 28, maxScale: 1 });
  ontoGraph = g;
}

function mdToHtml(src) {
  const pres = [];
  const s = String(src ?? '').replace(/```[a-zA-Z]*\n?([\s\S]*?)(?:```|$)/g, (m, code) => {
    pres.push(`<pre><code>${esc(code.replace(/\n+$/, ''))}</code></pre>`);
    return `\n${pres.length - 1}\n`;
  });
  const out = [];
  const lines = s.split('\n');
  let i = 0, list = null;
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  while (i < lines.length) {
    const ln = lines[i];
    const ph = ln.match(/^(\d+)$/);
    if (ph && pres[+ph[1]]) { closeList(); out.push(pres[+ph[1]]); i++; continue; }
    const h = ln.match(/^(#{1,4})\s+(.*)$/);
    if (h) { closeList(); out.push(`<h${h[1].length}>${mdInline(h[2])}</h${h[1].length}>`); i++; continue; }
    if (/^\s*\|.*\|\s*$/.test(ln) && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
      closeList();
      const cells = (l) => l.trim().replace(/^\||\|$/g, '').split('|').map((c) => c.trim());
      const head = cells(ln);
      i += 2;
      const rows = [];
      while (i < lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(cells(lines[i])); i++; }
      out.push('<table><tr>' + head.map((c) => `<th>${mdInline(c)}</th>`).join('') + '</tr>' +
        rows.map((r) => '<tr>' + r.map((c) => `<td>${mdInline(c)}</td>`).join('') + '</tr>').join('') + '</table>');
      continue;
    }
    const ul = ln.match(/^\s*[-*•]\s+(.*)$/);
    if (ul) { if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; } out.push(`<li>${mdInline(ul[1])}</li>`); i++; continue; }
    const ol = ln.match(/^\s*\d+[.、)]\s+(.*)$/);
    if (ol) { if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; } out.push(`<li>${mdInline(ol[1])}</li>`); i++; continue; }
    closeList();
    if (ln.trim()) out.push(`<p>${mdInline(ln)}</p>`);
    i++;
  }
  closeList();
  return out.join('');
}

function jsonPreviewText(obj) {
  if (obj == null) return '';
  if (typeof obj !== 'object') return String(obj);
  const entries = Object.entries(obj);
  const keys = entries.slice(0, 6).map(([k, v]) => k + ': ' + (typeof v === 'object' ? (Array.isArray(v) ? '[' + v.length + ']' : '{…}') : JSON.stringify(v)));
  return keys.join(' · ') + (entries.length > 6 ? ' · …共 ' + entries.length + ' 键' : '');
}
// 高亮 JSON（紧凑）：把 JSON.stringify(obj, null, 2) 逐行上色，不嵌套 DOM 树
function renderJsonTree(obj, maxDepth) {
  const json = JSON.stringify(obj, null, 2);
  if (json == null) return '';
  return json.replace(/("(?:\\u[0-9a-fA-F]{4}|\\[^u]|[^\\"])*"(?:\s*:)?|\b(?:true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, (m) => {
    if (/^"/.test(m)) {
      const cls = /:$/.test(m) ? 'jk' : 'js';
      return '<span class="' + cls + '">' + esc(m) + '</span>';
    }
    return /^(true|false|null)$/.test(m) ? '<span class="jb">' + m + '</span>' : '<span class="jn">' + m + '</span>';
  });
}

/* 智能滚动：用户本来就在底部附近才跟随到底，否则保持其阅读位置 */
function atBottom() { const c = $('#chat'); return c.scrollHeight - c.scrollTop - c.clientHeight < 120; }
function appendChat(el) {
  const keep = atBottom();
  $('#chat').appendChild(el);
  if (keep) requestAnimationFrame(() => { const c = $('#chat'); c.scrollTop = c.scrollHeight; });

function renderEvents(events) {
  for (const e of events) {
    const d = e.data ?? {};
    if (e.type === 'user/message') {
      // user/message 事件的 data 直挂消息本体（content/source/role），无 message 包装层
      const msg = d.message ?? d;
      const t = (msg.content ?? []).map((b) => b.text ?? '').join('').trim();
      const src = msg.source;
      if (src?.kind === 'plugin' && src.plugin === 'his-workspace-anchor') {
        // 工作区锚定注入：只显示一条摘要，全文不进会话流
        if (src.summary) {
          anchorObj = src.summary.replace(/^锚定切换: /, '');
          $('#anchor-obj').textContent = anchorObj;
          addMsg('anchor', src.summary, '锚定 · 工作区');
        }
      } else if (src?.kind === 'user') {
        if (t) addMsg('user', t, '你');
      }
      // 其余注入（goal 轮次 / skill 目录 / 系统快照）是 Agent 内部上下文，不进会话流
    } else if (e.type === 'assistant/message') {
      const blocks = d.message?.content ?? [];
      const t = blocks.filter((b) => b.type === 'text').map((b) => b.text).join('');
      const toolCalls = blocks.filter((b) => b.type === 'tool-call');
      // 可观测性·回合分组：本次回复若批量调了多个工具，建一个「回合容器」把它们收进一个整体单元，
      // 避免同名工具（如 policy_get_rules x3）平铺成独立卡、被误判为重复调用。
      if (toolCalls.length > 0) {
        const grp = document.createElement('div');
        grp.className = 'a-turn-group';
        grp.innerHTML = '<div class="tg-head"><span class="f-dot run"></span><span>本回合调用 ' + toolCalls.length + ' 个工具</span></div>';
        const toolsBox = document.createElement('div');
        toolsBox.className = 'tg-tools';
        grp.appendChild(toolsBox);
        if (t) {
          const body = document.createElement('div');
          body.className = 'a-body md';
          body.innerHTML = mdToHtml(t);
          grp.appendChild(body);
        }
        appendChat(grp);
        turnGroup = grp;
        turnGroupToolBox = toolsBox;
      } else {
        if (t) { addMsg('agent', t, 'Data Agent'); }
        turnGroup = null; turnGroupToolBox = null;
      }
      if (t && /【修复】|【忽略并提交】|请选择|修复.*忽略.*提交/.test(t)) {
        // 命中「修复 / 忽略并提交」决策点 → 弹审核按钮（用当前锚定文件；同 turn 只弹一次）
        const fp = active.file || (repoState.current && repoState.current);
        if (!renderDecisionCard.done) { renderDecisionCard.done = true; renderDecisionCard(fp, true); }
      }
    } else if (e.type === 'turn/start') {
      renderDecisionCard.done = false;
      busy = true; turnStartAt = Date.now(); showThinking('启动');
    } else if (e.type === 'step/start') {
      showThinking(`步骤 ${d.step}`);
      addStepLabel(d.step);
      foldState.tools = new Map(); foldState.think = null;
      turnGroup = null; turnGroupToolBox = null;
    } else if (e.type === 'reasoning-chunks') {
      if (busy) showThinking('思考中');
      const t = (d.texts ?? []).join('');
      if (t) {
        if (!foldState.think) {
          foldState.think = foldCard('think', '思考', '', {});
          foldBodySet(foldState.think, '<div class="f-body-text"></div>');
        }
        const box = foldState.think.querySelector('.f-body-text');
        box.textContent += t;
      }
    } else if (e.type === 'assistant/chunk' || e.type === 'text-chunks') {
      if (busy) showThinking('模型生成中');
    } else if (e.type === 'tool/call') {
      showThinking(`调用工具 ${d.name}`);
      const isOnto = ONTO_TOOLS.has(d.name);
      let argObj = {}; try { argObj = typeof d.arguments === 'string' ? JSON.parse(d.arguments || '{}') : (d.arguments ?? {}); } catch {}
      const label = ontoToolLabel(d.name, argObj);
      const argTxt = Object.keys(argObj).length ? JSON.stringify(argObj) : '';
      const card = foldCard('tool', label, argTxt, { onto: isOnto, state: 'run', parent: turnGroupToolBox });
      card.dataset.toolName = d.name;
      card.dataset.callId = d.callId;
      foldBodySet(card, '<div class="f-summary">调用中…</div>');
      foldState.tools.set(d.callId, card);
    } else if (e.type === 'tool/code-dispatch') {
      showThinking(`工具 ${d.name}`);
      const isOnto = ONTO_TOOLS.has(d.name);
      let argObj = {}; try { argObj = typeof d.arguments === 'string' ? JSON.parse(d.arguments || '{}') : (d.arguments ?? {}); } catch {}
      const label = ontoToolLabel(d.name, argObj);
      const card = foldCard('tool', label, d.isError ? '执行出错' : '', { onto: isOnto, state: d.isError ? 'err' : 'ok', parent: turnGroupToolBox });
      card.dataset.toolName = d.name;
      card.dataset.callId = d.callId;
      foldBodySet(card, d.isError ? '<div class="f-err">' + esc(d.message || '执行失败') + '</div>' : '<div class="f-summary">已执行</div>');
      foldState.tools.set(d.callId, card);
    } else if (e.type === 'tool/result') {
      showThinking('工具返回');
      for (const b of d.message?.content ?? []) {
        if (b.type !== 'tool-result') continue;
        const isErr = !!b.isError;
        let parsed = null, raw = '';
        const text = (b.content ?? []).map((c) => c.text ?? '').join('');
        try { parsed = JSON.parse(text); raw = JSON.stringify(parsed, null, 2); } catch { raw = text; }
        const callId = d.message?.source?.callId || b.toolCallId || d.callId;
        let card = callId ? foldState.tools.get(callId) : null;
        if (card) card.dataset.toolName = card.dataset.toolName || d.name;
        if (!card) {
          const isOnto = ONTO_TOOLS.has(d.name);
          card = foldCard('tool', d.name, '', { onto: isOnto, state: isErr ? 'err' : 'ok' });
          card.dataset.toolName = d.name;
        }
        const dot = card.querySelector('.f-dot');
        dot.className = 'f-dot ' + (isErr ? 'err' : 'ok');
        const preview = parsed && typeof parsed === 'object' ? jsonPreviewText(parsed) : (raw || '').slice(0, 80);
        const sub = card.querySelector('.f-sub');
        if (sub) sub.textContent = preview;
        foldBodySet(card, (isErr ? '<div class="f-err">' + esc(raw || '执行失败') + '</div>' : '<pre class="f-json">' + (parsed && typeof parsed === 'object' ? renderJsonTree(parsed) : esc(raw)) + '</pre>'));
      }
    } else if (e.type === 'approval/asked') {
      showThinking('等待你确认写操作');
    } else if (e.type === 'approval/decided') {
      const card = foldCard('approve', '审批', d.outcome === 'allowed-once' ? '✓ 已确认' : '✗ 已打回', { state: d.outcome === 'allowed-once' ? 'ok' : 'err' });
      foldBodySet(card, '<div>' + (d.outcome === 'allowed-once' ? '已确认执行' : '已打回') + '</div>');
    } else if (e.type === 'turn/end') {
      busy = false; hideThinking();
    }
    lastSeq = Math.max(lastSeq, e.seq);
  }
  renderAudit();
  if (events.some((e) => e.type === 'tool/result' || e.type === 'tool/code-dispatch')) {
    invalidateCaches(); testResults = {};
    renderWorkspace(); loadModels(); loadRepoTree(); renderFileTabs();
  }
}

    else chips = [
      { label: '新建 dwd 层作业的 ETL 与调度' },
      { label: '大促暂停/恢复编排', prompt: '大促前暂停财税域非核心离线作业：用 ops_screen 筛出目标清单（含自动排除项），ops_topo 按血缘排序后，直接把清单口径写进 approvalNote 调 ops_gen——确认走审批卡，不要在对话里问我确认；自检三件套结论讲清楚后依次走 repo_commit（序列确认）与 ops_deploy（部署确认，变更号找我索取，MANUAL 模式）。只产出 PAUSE/RESUME，DROP 类高危命令不进入本场景' },
    ];
  } else {
    const fd = erSel?.fieldData;
    if (erSel?.field && fd && !fd.std && !fd.skip) {
      // V12 bindfield：未绑定属性 → 补全标准
      chips = [{ label: `给 ${erSel.field} 补全数据标准`, prompt: `给 ${erSel.file} 的字段 ${erSel.field}（${fd.c ?? ''}）补全数据标准：先 std_search 找候选，命中则调 model_bind_std 绑定（写操作需我确认），无候选则建议先起草标准` }, { label: '分析未绑定字段并批量绑定' }];
    } else if (erSel?.field && fd?.std) {
      // V12 fieldinfo：已绑定属性 → 口径 + 影响分析
      chips = [{ label: `${erSel.field} · 标准口径与影响分析`, prompt: `字段 ${erSel.file} 的 ${erSel.field} 已绑定 ${fd.std}：说明该标准口径，并用 lineage_downstream / impact_check 分析它的下游作业影响面` }, { label: '分析未绑定字段并批量绑定' }];
    } else {
      chips = active.kind === 'model'
        ? [{ label: '分析未绑定字段并批量绑定' }, { label: '生成 DDL 核对标准引用' }, { label: '提交新版本并登记资产' }]
        : [{ label: '治理 dwd_tax_declaration 的标准绑定' }];
    }
  }
  $('#a-chips').innerHTML = chips.map((c, i) => `<button class="a-chip" data-i="${i}">${esc(c.label)}</button>`).join('');
  document.querySelectorAll('.a-chip').forEach((b) => b.addEventListener('click', () => {
    const c = chips[+b.dataset.i];
    if (c.action) { c.action(); return; }
    if (c.prompt) { send(c.prompt); return; }
    $('#prompt').value = c.label; $('#prompt').focus();
  }));
}

/* ================= 会话 ================= */
async function loadSessionList() {
  const d = await api('/api/sessions');
  const sel = $('#session-select');
  const cur = sel.value;
  sel.innerHTML = '<option value="">新会话</option>' + d.sessions.map((s) =>
    `<option value="${s.id}">${s.live ? '● ' : ''}${s.id.slice(8, 20)} · ${new Date(s.mtime).toLocaleTimeString()}</option>`).join('');
  sel.value = cur;
}
$('#session-select').addEventListener('change', async (e) => {
  sessionId = e.target.value || null;
  lastSeq = -1; $('#chat').innerHTML = ''; auditEvents = [];
  busy = false; turnStartAt = 0; lastPhase = '';
  $('#session-id').textContent = sessionId ? sessionId.slice(0, 18) : '';
  poll();
});
async function send(text, silent) {
  // 防抖/防重：上一轮未结束（busy）时忽略新的发送——按钮连点只发一条，
  // 避免「提交变更/修复/发送」连点给 Agent 塞多条重复消息（个数不稳定）。
  if (busy) return;
  const t = (text ?? $('#prompt').value).trim();
  if (!t) return;
  if (!silent) $('#prompt').value = '';
  busy = true; turnStartAt = Date.now(); showThinking('已发送，等待响应');
  try {
    const r = await api('/api/chat', { method: 'POST', body: JSON.stringify({ sessionId, text: t }) });
    if (!sessionId) { sessionId = r.sessionId; $('#session-id').textContent = sessionId.slice(0, 18); }
  } catch (e) { busy = false; hideThinking(); toast('发送失败: ' + (e?.message || e)); return; }
  poll();
}
$('#send').addEventListener('click', () => send());
$('#prompt').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
async function poll() {
  if (!sessionId) return;
  const d = await api(`/api/sessions/${sessionId}/events?after=${lastSeq}`);
  if (d.error) return;
  renderEvents(d.events);
  auditEvents = [...auditEvents, ...d.events];
  renderPendingApprovals(d.pendingApprovals ?? []);
  if (busy) {
    // 归档会话中途翻到、事件流已尽但没有 turn/end：90s 后自动解除心跳，避免假死
    if (!d.live && Date.now() - turnStartAt > 90000) { busy = false; hideThinking(); }
    else {
      const secs = Math.max(0, Math.round((Date.now() - turnStartAt) / 1000));
      $('#agent-status').textContent = `运行中 · ${lastPhase || '等待响应'} · ${secs}s`;
      return;
    }
  }
  $('#agent-status').textContent = d.live ? '会话活跃' : '已归档(重放)';
}
setInterval(() => { poll(); }, 1500);

loadModels(); loadRepoTree(); loadTenants(); loadSessionList(); renderChips(); renderWorkspace();
setInterval(loadSessionList, 5000);

/* 新建 SQL：仓库级操作，仓树头与代码页共用；新建后自动打开未提交文件、刷新仓树、出现提交按钮 */
async function newSql() {
  const def = 'dbscript/alter_dwd_' + (new Date().toISOString().slice(0, 10).replace(/-/g, '')) + '.sql';
  const name = prompt('新建 SQL 文件名（dbscript/ 下，.sql 结尾）', def);
  if (!name) return;
  if (!name.startsWith('dbscript/')) { toast('必须以 dbscript/ 开头'); return; }
  const r = await api('/api/repo/sql-create', { method: 'POST', body: JSON.stringify({ path: name }) });
  if (r.error) { toast('新建失败: ' + r.error); return; }
  if (!r.created) { toast(r.reason || '文件已存在'); return; }
  toast('已新建 ' + name + '（未提交）');
  invalidateCaches(); await loadRepoTree();
  openFile('repo', name);
}
const newSqlBtnHeader = document.getElementById('btn-new-sql');
if (newSqlBtnHeader) newSqlBtnHeader.addEventListener('click', newSql);

/* 切换工作区锚点：直接调 /api/anchor 设置锚点（不再经 agent 发 workspace_anchor 消息），
   避免「锚点一切换就触发一次 agent 会话/LLM 调用」。agent 下次真正提问时 pre-step 注入带入最新锚点摘要。 */
async function setAnchor(args) {
  try {
    const r = await api('/api/anchor', { method: 'POST', body: JSON.stringify(args) });
    if (r.error) { toast('锚点切换失败: ' + r.error); }
  } catch (e) { toast('锚点切换失败: ' + (e.message || e)); }
}

/* 默认模型切换（动态 provider + model 联动）：provider 下拉 = dsh-llm 已注册路由；
   model 下拉 = 该 provider 的模型列表；初始读当前默认。切换写 settings（agent-default-model），
   只影响新会话（清 sessionId 提示），旧会话 agent 已定死模型不换。 */
async function loadProviders() {
  try {
    const r = await api('/api/llm/providers');
    const sel = document.getElementById('provider-sel');
    if (!sel) return;
    const list = r.providers || [];
    if (!list.length) { sel.innerHTML = '<option value="">无可用 provider</option>'; return; }
    sel.innerHTML = list.map((p) => `<option value="${p.id}">${esc(p.name || p.id)}</option>`).join('');
    // 初始选中当前默认 provider
    const cur = await api('/api/model');
    if (cur.provider) sel.value = cur.provider;
    await loadModels(sel.value);
    // 初始 model 选中当前默认 model
    if (cur.model) { const ms = document.getElementById('model-sel'); if (ms) ms.value = cur.model; }
  } catch (e) {}
}
async function loadModels(provider) {
  const sel = document.getElementById('model-sel');
  if (!sel) return;
  if (!provider) { sel.innerHTML = '<option value="">先选 provider</option>'; return; }
  try {
    const r = await api('/api/llm/models?provider=' + encodeURIComponent(provider));
    const list = r.models || [];
    if (!list.length) { sel.innerHTML = '<option value="">该 provider 无模型</option>'; return; }
    sel.innerHTML = list.map((m) => `<option value="${m.id}">${esc(m.name || m.id)}</option>`).join('');
  } catch (e) { sel.innerHTML = '<option value="">模型加载失败</option>'; }
}
async function applyModelSwitch() {
  const ps = document.getElementById('provider-sel');
  const ms = document.getElementById('model-sel');
  const provider = ps ? ps.value : '';
  const model = ms ? ms.value : '';
  if (!provider || !model) { toast('请先选 provider 和模型'); return; }
  const r = await api('/api/model/switch', { method: 'POST', body: JSON.stringify({ provider, model }) });
  if (r.error) { toast('模型切换失败: ' + r.error); return; }
  if (sessionId) { sessionId = null; lastSeq = -1; toast('已切到 ' + provider + '/' + model + '，下一条消息将用新会话（新模型）'); }
  else toast('已切到 ' + provider + '/' + model);
}
const providerSel = document.getElementById('provider-sel');
const modelSel = document.getElementById('model-sel');
if (providerSel) providerSel.addEventListener('change', async () => { await loadModels(providerSel.value); applyModelSwitch(); });
if (modelSel) modelSel.addEventListener('change', applyModelSwitch);
loadProviders();

/* V18 · Agent 栏弹出式浮窗：docked ↔ floating 布局切换，工作区自动让位 */
const aPop = document.getElementById('a-pop');
if (aPop) aPop.addEventListener('click', () => {
  const floated = document.body.classList.toggle('agent-float');
  toast(floated ? '已弹出为浮窗 · 工作区已让位' : '已停靠回侧栏');
});
</script>
